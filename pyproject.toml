[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preprocess-file"
version = "0.1.0"
description = "Multi-format file preprocessing pipeline with type-aware routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "preprocess_file" }]
dependencies = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "charset-normalizer>=3.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
preprocess-file = "preprocess_file.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
